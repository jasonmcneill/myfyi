<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - My FYI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-purple-600 to-purple-900 min-h-screen flex items-center justify-center p-4"
  >
    <div class="bg-white rounded-lg shadow-2xl max-w-md w-full p-8">
      <h1 class="text-3xl font-bold text-center text-purple-600 mb-6">
        My FYI
      </h1>
      <h2 class="text-2xl font-bold text-gray-900 mb-8">
        Log In to Your Account
      </h2>

      <form id="loginForm" class="space-y-4">
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Email</label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
          />
        </div>

        <div id="error" class="text-red-600 text-sm mt-2"></div>

        <button
          type="submit"
          class="w-full bg-purple-600 text-white font-bold py-3 rounded-lg hover:bg-purple-700 transition-colors"
        >
          Log In
        </button>
      </form>

      <p class="text-center text-gray-600 text-sm mt-6">
        Don't have an account?
        <a
          href="/signup.html"
          class="text-purple-600 hover:text-purple-700 font-semibold"
          >Sign up</a
        >
      </p>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const errorDiv = document.getElementById("error");

          try {
            const response = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            if (!response.ok) {
              const error = await response.json();
              throw new Error(error.error || "Login failed");
            }

            const data = await response.json();
            localStorage.setItem("token", data.token);
            window.location.href = "/dashboard.html";
          } catch (error) {
            errorDiv.textContent = error.message;
            console.error("Login error:", error);
          }
        });
    </script>
  </body>
</html>
