<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - My FYI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.stripe.com/v3/"></script>
  </head>
  <body
    class="bg-gradient-to-br from-purple-600 to-purple-900 min-h-screen flex items-center justify-center p-4"
  >
    <div class="bg-white rounded-lg shadow-2xl max-w-md w-full p-8">
      <h1 class="text-3xl font-bold text-center text-purple-600 mb-6">
        My FYI
      </h1>
      <h2 class="text-2xl font-bold text-gray-900 mb-8">Create Your Account</h2>

      <form id="signupForm" class="space-y-4">
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Email</label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
          />
          <p class="text-xs text-gray-500 mt-1">Minimum 8 characters</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label
              for="firstName"
              class="block text-sm font-medium text-gray-700 mb-1"
              >First Name</label
            >
            <input
              type="text"
              id="firstName"
              name="firstName"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
            />
          </div>
          <div>
            <label
              for="lastName"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Last Name</label
            >
            <input
              type="text"
              id="lastName"
              name="lastName"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
            />
          </div>
        </div>

        <div>
          <label
            for="handle"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Handle</label
          >
          <input
            type="text"
            id="handle"
            name="handle"
            pattern="[a-zA-Z0-9_-]{3,50}"
            placeholder="my-profile-name"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
          />
          <p class="text-xs text-gray-500 mt-1">
            3-50 characters, alphanumeric, dash, underscore
          </p>
        </div>

        <div>
          <label
            for="promoCode"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Promo Code (Optional)</label
          >
          <input
            type="text"
            id="promoCode"
            name="promoCode"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
          />
        </div>

        <div
          id="card-element"
          class="border border-gray-300 rounded-lg p-4 bg-gray-50"
        ></div>
        <div
          id="card-errors"
          role="alert"
          class="text-red-600 text-sm mt-2"
        ></div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-purple-600 text-white font-bold py-3 rounded-lg hover:bg-purple-700 transition-colors"
        >
          Complete Sign Up ($7.95/month)
        </button>
      </form>

      <p class="text-center text-gray-600 text-sm mt-6">
        Already have an account?
        <a
          href="/login.html"
          class="text-purple-600 hover:text-purple-700 font-semibold"
          >Log in</a
        >
      </p>
    </div>

    <script src="/js/signup.v1.js"></script>
  </body>
</html>
